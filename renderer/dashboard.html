<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bioryx | Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="gooey-toast.css">
</head>
<body>
  <div class="title-bar">
    <div class="title-bar-title">Bioryx - Dashboard</div>
    <div class="window-controls">
      <button class="control-btn minimize" id="btn-minimize" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button class="control-btn maximize" id="btn-maximize" title="Maximize">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
      </button>
      <button class="control-btn close" id="btn-close" title="Close">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>

  <div class="dashboard-container">
    <div class="glow-bg blob-1"></div>
    <div class="glow-bg blob-2"></div>
    
    <header class="dashboard-header">
      <div class="header-content">
        <h1 class="app-title">Dashboard</h1>
        <div class="status-bar">
          <div class="status-indicator">
            <span class="status-dot" id="device-status-dot"></span>
            <span id="device-status-text">Device Status: Checking...</span>
          </div>
          <div class="sync-info">
            <span id="last-sync-time">Last Sync: --</span>
          </div>
          <button id="btn-manual-sync" class="glass-btn btn-small">Manual Sync</button>
        </div>
      </div>
    </header>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-icon blue-icon">
          <!-- User icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <div class="metric-info">
          <h3>Total Employees</h3>
          <p class="metric-value">150</p>
        </div>
      </div>
      
      <div class="metric-card">
        <div class="metric-icon green-icon">
          <!-- Check icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        </div>
        <div class="metric-info">
          <h3>Today's Attendance</h3>
          <p class="metric-value">145</p>
        </div>
      </div>

      <div class="metric-card">
        <div class="metric-icon yellow-icon">
          <!-- Clock icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>
        <div class="metric-info">
          <h3>Late Arrivals Today</h3>
          <p class="metric-value">12</p>
        </div>
      </div>

      <div class="metric-card">
        <div class="metric-icon red-icon">
          <!-- Alert icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        </div>
        <div class="metric-info">
          <h3>Missed Punches</h3>
          <p class="metric-value">3</p>
        </div>
      </div>
    </div>
  </div>

  <GooeyToaster position="top-right"></GooeyToaster>

  <script defer src="../dist/renderer/gooey-toast.js"></script>
  <script defer src="../dist/renderer/renderer.js"></script>
  <script defer src="../dist/renderer/dashboard.js"></script>
</body>
</html>
