<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bioryx | Attendance Synchronizer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="gooey-toast.css">
</head>
<body>
  <div class="app-container">
    <div class="glow-bg blob-1"></div>
    <div class="glow-bg blob-2"></div>
    
    <div class="glass-card">
      <div class="window-controls">
        <button class="control-btn minimize" id="btn-minimize" title="Minimize">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button class="control-btn close" id="btn-close" title="Close">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="logo-wrapper">
        <svg class="fingerprint-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 0 0-10 10c0 1.25.2 2.45.6 3.6"></path>
          <path d="M12 2a10 10 0 0 1 10 10c0 1.25-.2 2.45-.6 3.6"></path>
          <path d="M2.6 15.6A10 10 0 0 0 4 19.5"></path>
          <path d="M21.4 15.6A10 10 0 0 1 20 19.5"></path>
          <path d="M12 6a6 6 0 0 0-6 6c0 1.25.2 2.45.6 3.6"></path>
          <path d="M12 6a6 6 0 0 1 6 6c0 1.25-.2 2.45-.6 3.6"></path>
          <path d="M18 12a6 6 0 0 0-12 0"></path>
          <path d="M12 10a2 2 0 0 0-2 2c0 2 1.5 2 1.5 4v1.5"></path>
          <path d="M12 10a2 2 0 0 1 2 2c0 2-1.5 2-1.5 4v1.5"></path>
          <path d="M12 14c-.6 0-1-.4-1-1v-2c0-.6.4-1 1-1s1 .4 1 1v2c0 .6-.4 1-1 1z"></path>
          <path d="M12 22v-3.5"></path>
        </svg>
      </div>

      <h1 class="app-title">BIORYX</h1>
      <p class="app-subtitle">Attendance Synchronization System</p>
      
      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
        <div class="status-message" id="status-text">Initializing synchronization engine...</div>
      </div>
    </div>
  </div>

  <script defer src="../dist/renderer/gooey-toast.js"></script>
  <script defer src="../dist/renderer/renderer.js"></script>
</body>
</html>
